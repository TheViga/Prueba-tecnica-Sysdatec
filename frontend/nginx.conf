server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API calls are proxied to the backend service on the compose network, so the
  # browser only ever talks to a same-origin /api path (no CORS).
  location /api/ {
    proxy_pass http://backend:3004;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA fallback: every other route serves index.html so client routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
